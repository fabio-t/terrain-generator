[package]
name = "terrain_generator_nif"
version = "0.2.1"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
authors = ["Fabio Ticconi <fabio.ticconi@gmail.com>"]
description = "Rustler NIF bindings for the terrain-generator crate"
publish = false

[lib]
name = "terrain_generator_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
terrain-generator = { path = "../..", default-features = false, features = ["png"] }
