name: Release

# A release is a tag like v0.1.1: a GitHub release with prebuilt CLI
# binaries and the jar attached, then crates.io and Hex. A tag with a
# pre-release suffix (v0.1.5-rc3) stops at a GitHub pre-release.
#
# The tag can be pushed by hand, or made by this workflow: a manual run on
# `main` with `cut` tags `main` at the version its manifests carry.
on:
  push:
    tags:
      # both conventions fire a release: this project's tags used to be
      # unprefixed (0.1.1), and a mistyped convention would otherwise
      # publish nothing at all, silently
      - "v*"
      - "[0-9]*"
  # Manual runs build and test every artefact but stop short of publishing
  # (see the plan job), so the packaging can be exercised on a branch
  # without burning a tag. A manual run on a tag releases that tag, which
  # is how a release whose tag already exists is finished.
  workflow_dispatch:
    inputs:
      cut:
        description: "Release: tag main at its manifests' version and publish it (main only)"
        type: boolean
        default: false

# Two cuts of one ref at once would race to the same tag and registries.
concurrency: release-${{ github.ref }}

# **Read-only by default; only the job that creates the release may
# write.** The build jobs compile and run code from every dependency, on
# runners for three operating systems, and none of them needs to change
# the repository. A token that can push or rewrite a release is handed
# only to the one job that does.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # **Decides once what this run releases, and every later job reads it
  # from here.** Nothing downstream looks at `github.ref`, which on a cut
  # is `main` rather than the tag, and no job is ever skipped on the way
  # to the release, so none can silently skip the release with it.
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      cut: ${{ steps.plan.outputs.cut }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # **A tag that disagrees with the version stops the release here,
      # before anything is built.** The registries publish what the
      # manifests say, not what the tag says: a v0.4.0 tag on a commit
      # still at 0.3.0 would make a GitHub release called v0.4.0 and then
      # fail to republish 0.3.0. A pre-release tag (v0.4.0-rc1) is checked
      # against its base version, which the manifests already carry.
      - name: Decide what this run releases
        id: plan
        env:
          CUT: ${{ inputs.cut }}
        run: |
          set -euo pipefail
          cut=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ "$CUT" = true ]; then
            # A release is the reviewed, squash-merged release PR, so only
            # `main` is cut. A candidate is a hand-pushed -rcN tag.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::cut releases main, and this run is on $GITHUB_REF_NAME"
              exit 1
            fi
            tag="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || rc=$?
            case $rc in
              0) echo "::error::$tag already exists: bump the version, or run this workflow on the tag to finish its release"
                 exit 1 ;;
              2) ;;
              *) echo "::error::could not list the remote's tags"; exit 1 ;;
            esac
            cut=true
          else
            # A branch name can contain slashes, which would be an illegal
            # filename, so a dry run names its artefacts "dev".
            { echo release=false; echo cut=false; echo tag=dev
              echo version=dev; echo prerelease=false; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${tag#v}"
          base="${version%%-*}"
          prerelease=false
          [ "$version" = "$base" ] || prerelease=true
          bad=0
          for f in Cargo.toml native/terrain_generator_nif/Cargo.toml \
                   native/terrain_generator_ffi/Cargo.toml mix.exs; do
            have=$(sed -n -e 's/^version = "\(.*\)"$/\1/p' \
                          -e 's/^  @version "\(.*\)"$/\1/p' "$f" | head -1)
            if [ "$have" != "$base" ]; then
              echo "::error file=$f::version is '$have', the tag says $base"
              bad=1
            fi
          done
          # The section becomes the release notes. A candidate may come
          # before its section is named, so only a final requires it.
          if [ $prerelease = false ] &&
             ! awk -v h="## $base" 'index($0, h " ") == 1 || $0 == h { f = 1 } END { exit !f }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## $base' section"
            bad=1
          fi
          [ $bad = 0 ] || exit 1
          { echo release=true; echo cut=$cut; echo tag=$tag
            echo version=$version; echo prerelease=$prerelease; } >> "$GITHUB_OUTPUT"
          echo "::notice::releasing $tag$([ $cut = true ] && echo ", to be tagged on $GITHUB_SHA")"

  test:
    name: Test before release
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain is pinned in mise.toml (see the comment there), and
      # read from it here so the two cannot disagree. Bash on every runner,
      # Windows included; the pattern stops at the closing quote so a CRLF
      # checkout cannot carry a \r into the version.
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^rust *= *"\([^"]*\)".*/\1/p' mise.toml)
          test -n "$v" || { echo 'no rust = "..." in mise.toml' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      # **Restores the cache `main`'s CI saved, and never writes its own.**
      # A tag run can restore from its own ref and from the default branch,
      # nothing else, so a cache saved under a tag is read by nobody. This
      # job builds what ci.yml's Rust job builds (the libraries' workspace;
      # the GUI is not released), so it shares that job's key and starts warm
      # off `main`.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [plan, test]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^rust *= *"\([^"]*\)".*/\1/p' mise.toml)
          test -n "$v" || { echo 'no rust = "..." in mise.toml' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ matrix.target }}

      # Saved on branch dispatches, where a second run while preparing a
      # release reuses it; not on tags, whose caches nothing can restore.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Build
        run: cargo build --release --locked -p terrain-generator --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="terrain-generator-${RELEASE_VERSION}-${{ matrix.target }}"
          mkdir "$name"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/terrain-generator.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/terrain-generator" "$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            terrain-generator-*.tar.gz
            terrain-generator-*.zip
          if-no-files-found: error

  natives:
    name: Native library ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Deliberately gnu rather than the musl target the CLI uses: this
          # library is dlopen'd into a JVM process, which on Linux is a
          # glibc process, and mixing two libcs in one address space is not
          # something to ship. The runner is pinned a release behind so the
          # glibc a consumer needs stays 2.35 rather than 2.39.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux-x86_64
            lib: libterrain_generator_ffi.so
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x86_64
            lib: libterrain_generator_ffi.dylib
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-aarch64
            lib: libterrain_generator_ffi.dylib
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64
            lib: terrain_generator_ffi.dll
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^rust *= *"\([^"]*\)".*/\1/p' mise.toml)
          test -n "$v" || { echo 'no rust = "..." in mise.toml' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ matrix.target }}

      # see the note in the build job
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-${{ matrix.target }}
          save-if: ${{ github.ref_type != 'tag' }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        run: cargo build --release --locked -p terrain_generator_ffi --target ${{ matrix.target }}

      - name: Stage under its platform directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "natives/${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" \
             "natives/${{ matrix.platform }}/"

      # Pack a single-platform jar and run the binding tests out of it,
      # with nothing on the library search path. This is the only place
      # the loader's os.name/os.arch mapping is exercised on a real macOS
      # or Windows machine — get it wrong and the released jar would fail
      # on the consumer's machine, not here.
      # Skipped for macos-x86_64 alone: the macOS runners are Apple
      # Silicon, so that one is a cross-build and its dylib cannot be
      # loaded here. Its sibling macos-aarch64 covers the same code path
      # on the same OS.
      - name: Verify the loader finds the bundled library
        if: matrix.platform != 'macos-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          jar="java/out/terrain-generator-smoke.jar"
          if [[ "${{ matrix.platform }}" == windows-* ]]; then sep=";"; else sep=":"; fi
          bash java/package-jar.sh smoke natives
          mkdir -p java/out/test
          javac --release 22 -cp "$jar" -d java/out/test java/TerrainGeneratorTest.java
          java --enable-native-access=ALL-UNNAMED \
               -cp "$jar$sep"java/out/test TerrainGeneratorTest

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: natives
          if-no-files-found: error

  jar:
    name: Package the Java bindings
    needs: [plan, natives]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: natives
          merge-multiple: true

      # One jar carrying every platform's library, so a Java consumer needs
      # no Rust toolchain and nothing to install.
      - name: Build the jar
        run: bash java/package-jar.sh "${RELEASE_VERSION#v}" natives

      # Proves the release artifact itself loads its bundled library, with
      # nothing on the library search path to fall back to. This runner can
      # only exercise linux-x86_64; each of the other three was checked on
      # its own runner in the natives job above.
      - name: Smoke-test the packaged jar
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          jar="java/out/terrain-generator-$version.jar"
          mkdir -p java/out/test
          javac --release 22 -cp "$jar" -d java/out/test java/TerrainGeneratorTest.java
          java --enable-native-access=ALL-UNNAMED \
               -cp "$jar:java/out/test" TerrainGeneratorTest

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: java/out/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: [plan, build, jar]
    # A dry run stops here, having still built and tested every artefact
    # the release would have carried.
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # pushes a cut's tag, creates the release and uploads its assets
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # **A cut tags only now, once everything has built and passed**, so
      # a failed build leaves no tag to clean up. A tag pushed with this
      # job's token starts no workflow run, so this run carries on as the
      # release. A re-run finds its own tag already there and goes on.
      - name: Tag the release
        if: needs.plan.outputs.cut == 'true'
        run: |
          set -euo pipefail
          at=$(git ls-remote origin "refs/tags/$RELEASE_VERSION^{}" | cut -f1)
          if [ "$at" = "$GITHUB_SHA" ]; then
            echo "$RELEASE_VERSION is already on $GITHUB_SHA"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_VERSION" -m "$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"

      # Named patterns rather than "everything": the per-platform native
      # artifacts are build inputs for the jar, not release assets.
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum terrain-generator-* > SHA256SUMS.txt

      # Use the hand-written CHANGELOG entry as the release body, so a
      # release says what changed rather than only listing commits. A
      # pre-release tag (v1.2.3-rc1) falls back to its base version's
      # section, and a missing section is a warning rather than a failure:
      # the binaries are already built by this point.
      - name: Extract release notes from the CHANGELOG
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          base="${version%%-*}"

          extract() {
            awk -v v="$1" '
              index($0, "## " v) == 1 { found = 1; next }
              found && index($0, "## ") == 1 { exit }
              found { print }
            ' CHANGELOG.md
          }

          extract "$version" > notes.md
          if [ ! -s notes.md ]; then
            extract "$base" > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG section for $version; \
              falling back to generated notes only"
            : > notes.md
          fi
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: dist/*
          # a hyphen in the tag (v0.1.5-rc3) marks a semver pre-release
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          body_path: notes.md
          # commit list is appended below the CHANGELOG text
          generate_release_notes: true

  # **The registries come last**, once every artefact is built and the
  # GitHub release exists: a version on crates.io or Hex can never be
  # deleted or replaced, only retired. Pre-release tags stop at the
  # GitHub release for the same reason.
  #
  # Each job skips when the version is already there, so a release
  # re-run after a failure (or after publishing by hand) finishes rather
  # than failing on the duplicate.
  crates-io:
    name: Publish to crates.io
    needs: [plan, release]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      # Trusted publishing: crates.io exchanges this job's OIDC token for a
      # publish token that lives for 30 minutes, so the repository stores
      # no crates.io secret. It is configured on the crate's settings page
      # on crates.io, which exists only once the crate does, so the first
      # version had to be published by hand.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^rust *= *"\([^"]*\)".*/\1/p' mise.toml)
          test -n "$v" || { echo 'no rust = "..." in mise.toml' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - name: Check whether this version is already published
        id: published
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'terrain-generator release workflow (github.com/fabio-t/terrain-generator)' \
            "https://crates.io/api/v1/crates/terrain-generator/${VERSION}")
          echo "crates.io answered $code"
          if [ "$code" = 200 ]; then
            echo "::notice::terrain-generator ${VERSION} is already on crates.io"
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.yes != 'true'
        id: auth
      - name: Publish
        if: steps.published.outputs.yes != 'true'
        run: cargo publish -p terrain-generator --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  hex:
    name: Publish to Hex
    needs: [plan, release]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # `mix hex.publish` builds the docs, which compiles the project and so
      # the NIF: it needs the same Rust the rest of the release used.
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^rust *= *"\([^"]*\)".*/\1/p' mise.toml)
          test -n "$v" || { echo 'no rust = "..." in mise.toml' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      # the versions ci.yml's Elixir job tests with
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Check whether this version is already published
        id: published
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hex.pm/api/packages/terrain_generator/releases/${VERSION}")
          echo "hex.pm answered $code"
          if [ "$code" = 200 ]; then
            echo "::notice::terrain_generator ${VERSION} is already on Hex"
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      # Hex has no trusted publishing, so this is an API key with only the
      # api:write permission, stored as a repository secret.
      - name: Publish
        if: steps.published.outputs.yes != 'true'
        run: |
          if [ -z "$HEX_API_KEY" ]; then
            echo "::error::the HEX_API_KEY repository secret is not set"
            exit 1
          fi
          mix deps.get --check-locked
          mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
