name: CI

# Pushes to the default branch run CI automatically. Everything else —
# pull requests included — is run on demand from the Actions tab
# ("Run workflow", pick any branch), to keep Actions minutes down.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A dispatch that lands while an earlier one on the same branch is still
# going supersedes it: only the tip needs to be known-good.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain is pinned in mise.toml (see the comment there), and
      # read from it here so the two cannot disagree. The same step is in
      # every job of both workflows; release.yml runs it on Windows too,
      # hence bash, and a pattern that stops at the closing quote so a CRLF
      # checkout cannot carry a \r into the version.
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^rust *= *"\([^"]*\)".*/\1/p' mise.toml)
          test -n "$v" || { echo 'no rust = "..." in mise.toml' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # shared with release.yml's test job, which builds the same tree:
          # a tag can only restore `main`'s caches, so this is the one it gets
          shared-key: workspace
          # A failed run has still paid to compile the dependencies. Without
          # this they are thrown away and the push that fixes the failure
          # starts cold.
          cache-on-failure: true
          # **Only `main` writes a cache; every branch reads `main`'s.**
          # A cache saved on a branch can only ever be restored by that same
          # branch, so dispatches on topic branches stored copies nothing
          # else would read -- and the repo's cache budget is LRU-evicted, so
          # those copies push out `main`'s, the one every run falls back to.
          # A branch that changes Cargo.lock builds the difference cold until
          # it merges; the first `main` run afterwards stores it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Test (default features)
        run: cargo test --workspace
      - name: Build (library only, no default features)
        run: cargo build --no-default-features
      - name: Test (png feature only)
        run: cargo test --lib --no-default-features --features png

      # keeps the declared rust-version honest: bump it here if this fails.
      # The GUI is not in this workspace, so it is not checked: it is an
      # unpublished app, and eframe's MSRV must not dictate the libraries'.
      - name: Verify MSRV (rust-version in Cargo.toml)
        run: |
          MSRV=$(cargo metadata --format-version 1 --no-deps | python3 -c "
          import json, sys
          vs = [p['rust_version'] for p in json.load(sys.stdin)['packages'] if p.get('rust_version')]
          print(max(vs, key=lambda v: tuple(int(x) for x in v.split('.'))))")
          echo "declared MSRV: $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          cargo +"$MSRV" check --workspace --locked

  # The GUI is its own Cargo workspace (see `exclude` in Cargo.toml), so it
  # gets its own job: it runs alongside the others instead of after them,
  # and its ~440 crates get a cache of their own rather than inflating the
  # libraries'.
  gui:
    name: GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^rust *= *"\([^"]*\)".*/\1/p' mise.toml)
          test -n "$v" || { echo 'no rust = "..." in mise.toml' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui -> target
          cache-on-failure: true
          # see the note in the Rust job
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --manifest-path gui/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path gui/Cargo.toml --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path gui/Cargo.toml --locked

  elixir:
    name: Elixir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          v=$(sed -n 's/^rust *= *"\([^"]*\)".*/\1/p' mise.toml)
          test -n "$v" || { echo 'no rust = "..." in mise.toml' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # see the note in the Rust job
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Fetch dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Test
        run: mix test
      # **Builds the NIF from the Hex package, as a user's `mix compile`
      # does.** Cargo needs every member of the workspace to build any of
      # them, so a crate added to the workspace but not to `files` in
      # mix.exs breaks every install from Hex, while the checkout above
      # still builds. That isml' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      # No rust-cache here, on purpose: this job builds only the FFI crate
      # and its handful of dependencies, which took 4.7 s cold (run
      # 39477903683). Saving that cache took longer than the build and
      # stored ~95 MB (mostly the crates.io registry) against the repo's
      # cache budget, where it competes with the Rust job's cache, which
      # does save minutes.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # the bindings use the Foreign Function & Memory API, final in 22
          java-version: "25"
      - name: Build native library and run the binding tests
        run: ./java/build.sh
